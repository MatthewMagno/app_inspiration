<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon Inspiration</title>
<style>
:root{--bg:#16130f;--panel:#1f1b16;--line:#2f2a22;--fg:#f1e9dc;--mute:#9a907f;--acc:#e8a15b;--cell:#2a251e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(22,19,15,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row+.row{margin-top:8px}
h1{font-size:15px;margin:0 12px 0 0}
button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
button{cursor:pointer}
button.on{background:var(--acc);color:#1a1208;border-color:var(--acc)}
input[type=search]{min-width:200px}
input[type=range]{padding:0;width:120px;accent-color:var(--acc)}
label{color:var(--mute);display:flex;align-items:center;gap:6px}
.count{color:var(--mute);margin-left:auto}
.note{color:var(--mute);font-size:12px}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size),1fr));gap:14px}
.cell{position:relative;background:var(--cell);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:1px solid transparent;min-width:0}
.cell:hover{border-color:var(--acc)}
.cell img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--ibg,transparent);border-radius:var(--rad,0);display:block}
.cell .nm{font-size:11px;color:var(--mute);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .fav{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.45);border-radius:50%;width:26px;height:26px;padding:0;font-size:14px;opacity:0;line-height:26px;text-align:center}
.cell:hover .fav,.cell .fav.on{opacity:1}
.cell .fav.on{background:var(--acc);color:#1a1208}
.hide-names .nm{display:none}
#more{display:block;margin:20px auto;padding:10px 24px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:12px}
#lb.open{display:flex}
#lb img{max-width:min(80vw,640px);max-height:64vh;border-radius:var(--rad,0);background:var(--ibg,transparent)}
#lb .meta{color:var(--mute);text-align:center}
#lb a{color:var(--acc)}
.tiny{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tiny img{width:60px;height:60px;border-radius:13px;object-fit:contain}
.tiny img.sm{width:29px;height:29px;border-radius:6px}
.empty{color:var(--mute);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="row">
    <a href="../" style="color:var(--mute);text-decoration:none">← Home</a>
    <h1>Icon Inspiration</h1>
    <div id="sources" class="row" style="margin:0"></div>
    <span class="count" id="count"></span>
  </div>
  <div class="row">
    <input type="search" id="q" placeholder="Search names…">
    <select id="genre" style="display:none"></select>
    <select id="sort" style="display:none"><option value="r">Most rated</option><option value="s">Highest rated</option><option value="n">A–Z</option><option value="x">Shuffle</option></select>
    <label>Size <input type="range" id="size" min="56" max="220" value="104"></label>
    <label>Background
      <select id="bg"><option value="">None</option><option value="#ffffff">White</option><option value="#111111">Black</option><option value="#8a8f98">Grey</option></select></label>
    <label><input type="checkbox" id="round" checked> Round corners (iOS)</label>
    <label><input type="checkbox" id="names" checked> Names</label>
    <button id="picks">♥ Picks (<span id="pc">0</span>)</button>
    <button id="export">Export picks</button>
    <span class="note" id="srcnote"></span>
  </div>
</header>
<main><div id="grid" class="grid"></div><button id="more" style="display:none">Load more</button></main>
<div id="lb"><img id="lbimg"><div class="tiny" id="tiny"></div><div class="meta" id="lbmeta"></div></div>
<script>
const $=s=>document.querySelector(s);
const PAGE=240;
let sources=[],cur=null,list=[],shown=0,showPicks=false;
let picks=new Map(JSON.parse(localStorage.getItem('iconPicks')||'[]'));
const savePicks=()=>{localStorage.setItem('iconPicks',JSON.stringify([...picks]));$('#pc').textContent=picks.size};

fetch('data/gallery.json').then(r=>r.json()).then(d=>{
  sources=d;
  const bar=$('#sources');
  const all=document.createElement('button');all.textContent='All GitHub packs';all.dataset.id='__repos';bar.append(all);
  d.forEach(s=>{const b=document.createElement('button');b.dataset.id=s.id;
    b.textContent=(s.type==='repo'?s.id.split('/')[1]:'App Store')+' ('+s.items.length+')';bar.append(b)});
  bar.onclick=e=>{if(e.target.dataset.id){showPicks=false;pick(e.target.dataset.id)}};
  const genres=[...new Set(d.find(s=>s.type==='store').items.map(i=>i.g))].sort();
  $('#genre').innerHTML='<option value="">All categories</option>'+genres.map(g=>`<option>${g}</option>`).join('');
  pick('App Store');
});

function pick(id){
  cur=id;
  document.querySelectorAll('#sources button').forEach(b=>b.classList.toggle('on',b.dataset.id===id&&!showPicks));
  $('#picks').classList.toggle('on',showPicks);
  const store=id==='App Store'&&!showPicks;
  $('#genre').style.display=store?'':'none';$('#sort').style.display=store?'':'none';
  const s=sources.find(x=>x.id===id);
  $('#srcnote').innerHTML=showPicks?'':id==='__repos'?'Community icon packs from GitHub repos':
    s.type==='repo'?`<a style="color:var(--acc)" target="_blank" href="${s.url}">${s.id}</a> ★${s.stars} · ${s.note}`:s.note;
  refresh();
}
function refresh(){
  const q=$('#q').value.trim().toLowerCase(),g=$('#genre').value,sort=$('#sort').value;
  let items;
  if(showPicks) items=[...picks.values()];
  else if(cur==='__repos') items=sources.filter(s=>s.type==='repo').flatMap(s=>s.items.map(i=>({...i,g:s.id.split('/')[1]})));
  else items=sources.find(s=>s.id===cur).items.map(i=>({...i,g:i.g||''}));
  if(q) items=items.filter(i=>i.n.toLowerCase().includes(q)||(i.g||'').toLowerCase().includes(q));
  if(g&&cur==='App Store'&&!showPicks) items=items.filter(i=>i.g===g);
  if(cur==='App Store'&&!showPicks){
    if(sort==='s') items=[...items].sort((a,b)=>b.s-a.s||b.r-a.r);
    else if(sort==='n') items=[...items].sort((a,b)=>a.n.localeCompare(b.n));
    else if(sort==='x') items=[...items].sort(()=>Math.random()-.5);
  } else if(cur==='__repos'&&!showPicks){ items=[...items].sort(()=>Math.random()-.5); }
  list=items;shown=0;$('#grid').innerHTML='';
  $('#count').textContent=items.length.toLocaleString()+' icons';
  if(!items.length)$('#grid').innerHTML='<div class="empty">Nothing here yet.</div>';
  more();
}
function more(){
  const g=$('#grid'),frag=document.createDocumentFragment();
  list.slice(shown,shown+PAGE).forEach(i=>{
    const c=document.createElement('div');c.className='cell';
    const on=picks.has(i.u);
    c.innerHTML=`<button class="fav${on?' on':''}" title="Pick">♥</button><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="" src="${i.u}"><div class="nm"></div>`;
    c.querySelector('.nm').textContent=i.n;
    c.querySelector('img').onerror=e=>{c.remove()};
    c.querySelector('.fav').onclick=e=>{e.stopPropagation();
      if(picks.has(i.u)){picks.delete(i.u);e.target.classList.remove('on');if(showPicks)c.remove()}else{picks.set(i.u,i);e.target.classList.add('on')}savePicks()};
    c.onclick=()=>openLb(i);
    frag.append(c)});
  g.append(frag);shown+=PAGE;
  $('#more').style.display=shown<list.length?'block':'none';
}
function openLb(i){
  $('#lbimg').src=i.u;
  $('#tiny').innerHTML=[60,40,29].map((w,k)=>`<img class="${k==2?'sm':''}" style="width:${w}px;height:${w}px;border-radius:${w*.22}px;background:var(--ibg,transparent)" src="${i.u}">`).join('');
  $('#lbmeta').innerHTML=`<b style="color:var(--fg)">${i.n.replace(/</g,'&lt;')}</b>${i.g?' · '+i.g:''}${i.r?` · ${i.r.toLocaleString()} ratings`:''}<br><a target="_blank" href="${i.l}">Open source ↗</a> · click anywhere to close`;
  $('#lb').classList.add('open');
}
$('#lb').onclick=e=>{if(e.target.tagName!=='A')$('#lb').classList.remove('open')};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('open')});

$('#size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.documentElement.style.setProperty('--size','104px');document.documentElement.style.setProperty('--rad','22%');
$('#bg').onchange=e=>document.documentElement.style.setProperty('--ibg',e.target.value||'transparent');
$('#round').onchange=e=>document.documentElement.style.setProperty('--rad',e.target.checked?'22%':'0');
$('#names').onchange=e=>$('#grid').classList.toggle('hide-names',!e.target.checked);
let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(refresh,150)};
$('#genre').onchange=refresh;$('#sort').onchange=refresh;
$('#more').onclick=more;
$('#picks').onclick=()=>{showPicks=!showPicks;pick(cur||'App Store')};
$('#export').onclick=()=>{const t=[...picks.values()].map(i=>`${i.n}\t${i.l}\t${i.u}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Copied '+picks.size+' picks to clipboard'))};
new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown<list.length)more()},{rootMargin:'800px'}).observe($('#more'));
savePicks();
</script>
</body>
</html>
